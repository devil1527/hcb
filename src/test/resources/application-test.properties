# Test Configuration using H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:hcbtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.mail.host=localhost
spring.mail.port=25
management.health.mail.enabled=false

hcb.upload.dir=target/test-uploads
hcb.upi.id=test@upi
hcb.upi.name=Test Store
hcb.whatsapp.number=919999999999
