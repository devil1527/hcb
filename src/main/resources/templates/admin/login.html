<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Healthy Choco Bytes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/hcb.css(v='2.4')}">

    <style>
        body.admin-login-body {
            background: linear-gradient(135deg, #180d08 0%, #2e1a12 50%, #150a06 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            color: #f7ede2;
        }

        .admin-login-card {
            background: rgba(36, 20, 14, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            padding: 2.8rem 2.2rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(212, 175, 55, 0.08);
            position: relative;
            overflow: hidden;
        }

        .admin-login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #b8860b, #d4af37, #f3e5ab, #d4af37, #b8860b);
        }

        .admin-brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-shield-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0.05) 70%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }

        .admin-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 0.3rem 0.9rem;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 0.4rem 0;
            letter-spacing: 0.5px;
        }

        .admin-subtitle {
            font-size: 0.84rem;
            color: #c9b09a;
            line-height: 1.5;
            margin: 0;
        }

        .admin-form-group {
            margin-bottom: 1.4rem;
        }

        .admin-form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #e6ccb2;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 0.5rem;
        }

        .admin-input-wrapper {
            position: relative;
        }

        .admin-input-wrapper i.prefix-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c6d58;
            font-size: 0.95rem;
        }

        .admin-input {
            width: 100%;
            background: rgba(20, 10, 6, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 10px;
            padding: 0.85rem 1rem 0.85rem 2.6rem;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .admin-input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
            background: rgba(24, 12, 8, 0.9);
        }

        .admin-input::placeholder {
            color: #7d6556;
        }

        .btn-admin-submit {
            width: 100%;
            background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #b8860b 100%);
            color: #1a0f08;
            border: none;
            border-radius: 10px;
            padding: 0.95rem;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.8rem;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
        }

        .btn-admin-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #c59b27 0%, #e5c158 50%, #c59b27 100%);
        }

        .btn-admin-submit:active {
            transform: translateY(0);
        }

        .admin-security-footer {
            margin-top: 2rem;
            padding-top: 1.4rem;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            text-align: center;
        }

        .security-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.73rem;
            color: #9c8270;
            margin-bottom: 1.2rem;
        }

        .store-return-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #d4af37;
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .store-return-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .admin-alert {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            font-size: 0.84rem;
            margin-bottom: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .admin-alert-danger {
            background: rgba(180, 40, 40, 0.2);
            border: 1px solid rgba(240, 80, 80, 0.4);
            color: #ff9999;
        }

        .admin-alert-success {
            background: rgba(40, 140, 60, 0.2);
            border: 1px solid rgba(60, 200, 90, 0.4);
            color: #99f0b0;
        }

        @media (max-width: 480px) {
            body.admin-login-body {
                padding: 1rem 0.75rem;
                align-items: flex-start;
                padding-top: 2rem;
            }
            .admin-login-card {
                padding: 1.8rem 1.25rem;
                border-radius: 16px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            }
            .admin-title {
                font-size: 1.5rem;
            }
            .admin-subtitle {
                font-size: 0.78rem;
            }
            .admin-shield-icon {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
                margin-bottom: 0.8rem;
            }
            .admin-badge {
                font-size: 0.65rem;
                padding: 0.25rem 0.75rem;
            }
            .admin-input {
                font-size: 16px !important;
                padding: 0.8rem 0.85rem 0.8rem 2.4rem;
            }
            .btn-admin-submit {
                font-size: 0.88rem;
                padding: 0.85rem;
            }
        }

        @media (max-width: 360px) {
            body.admin-login-body {
                padding: 0.75rem 0.5rem;
                padding-top: 1rem;
            }
            .admin-login-card {
                padding: 1.4rem 0.9rem;
            }
            .admin-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body class="admin-login-body">

    <div class="admin-login-card">
        
        <div class="admin-brand-header">
            <div class="admin-shield-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <div class="admin-badge">HCB Management Console</div>
            <h1 class="admin-title">Admin Portal</h1>
            <p class="admin-subtitle">Restricted operations, catalog management & order verification</p>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${errorMessage}" class="admin-alert admin-alert-danger">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${errorMessage}">Invalid credentials.</span>
        </div>
        <div th:if="${successMessage}" class="admin-alert admin-alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}">Logged out successfully.</span>
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="admin-form-group">
                <label for="username">Administrator ID</label>
                <div class="admin-input-wrapper">
                    <i class="fas fa-user-shield prefix-icon"></i>
                    <input type="text" id="username" name="username" class="admin-input" 
                           placeholder="Admin email or 10-digit mobile" required autofocus autocomplete="username">
                </div>
            </div>

            <div class="admin-form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                </div>
                <div class="admin-input-wrapper">
                    <i class="fas fa-lock prefix-icon"></i>
                    <input type="password" id="password" name="password" class="admin-input" 
                           placeholder="Enter administrator password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-admin-submit">
                <i class="fas fa-lock-open"></i> Authenticate & Enter Console
            </button>
        </form>

        <div class="admin-security-footer">
            <div class="security-notice">
                <i class="fas fa-user-lock"></i>
                <span>Authorized Personnel Only &bull; IP & Session Audited</span>
            </div>
            <a th:href="@{/}" class="store-return-link">
                <i class="fas fa-arrow-left"></i> Return to Healthy Choco Bytes Store
            </a>
        </div>

    </div>

</body>
</html>
