<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Healthy Choco Bytes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/hcb.css(v='2.3')}">
</head>
<body>

    <nav th:replace="~{fragments/header :: nav}"></nav>

    <main>
        <div class="form-container">
            <h1 class="form-title">Reset Password</h1>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Enter your email to receive password reset instructions</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success">
                <p th:text="${successMessage}"></p>
                <div th:if="${resetToken}" style="margin-top: 10px; padding: 10px; background: white; border-radius: 6px; word-break: break-all;">
                    <strong>Direct Reset Link:</strong><br>
                    <a th:href="@{'/reset-password?token=' + ${resetToken}}"
                       style="color: var(--gold-accent); font-weight: 600;"
                       th:text="@{'/reset-password?token=' + ${resetToken}}"></a>
                </div>
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
                <div class="form-group">
                    <label for="email">Registered Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter your email" required autofocus>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></span>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-choco" style="width: 100%; border: none;">
                        <i class="fas fa-paper-plane"></i> Send Reset Link
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--bg-beige); font-size: 0.9rem;">
                Remembered your password? 
                <a th:href="@{/login}" style="color: var(--gold-accent); font-weight: 600; text-decoration: none;">Return to login</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/cart-drawer :: cartDrawer}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/hcb-cart.js}"></script>
    <script th:src="@{/js/hcb-main.js}"></script>
</body>
</html>
