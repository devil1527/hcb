<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Healthy Choco Bytes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/hcb.css(v='2.3')}">
</head>
<body>

    <nav th:replace="~{fragments/header :: nav}"></nav>

    <main>
        <div class="form-container">
            <h1 class="form-title">Welcome Back</h1>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Log in to access your orders or manage the admin dashboard</p>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Email or Mobile Number</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your email or 10-digit mobile" required autofocus>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label for="password" style="margin-bottom: 0;">Password</label>
                        <a th:href="@{/forgot-password}" style="font-size: 0.8rem; color: var(--gold-accent); text-decoration: none;">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-choco" style="width: 100%; border: none;">
                        <i class="fas fa-sign-in-alt"></i> Log In
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--bg-beige); font-size: 0.9rem;">
                Don't have an account yet? 
                <a th:href="@{/register}" style="color: var(--gold-accent); font-weight: 600; text-decoration: none;">Create one here</a>
            </div>

            <div style="text-align: center; margin-top: 1.2rem; font-size: 0.8rem;">
                <a th:href="@{/admin/login}" style="color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
                    <i class="fas fa-shield-alt"></i> Staff & Admin Portal
                </a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/cart-drawer :: cartDrawer}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/hcb-cart.js}"></script>
    <script th:src="@{/js/hcb-main.js}"></script>
</body>
</html>
