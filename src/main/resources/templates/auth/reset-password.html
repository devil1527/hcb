<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Healthy Choco Bytes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/hcb.css(v='2.3')}">
</head>
<body>

    <nav th:replace="~{fragments/header :: nav}"></nav>

    <main>
        <div class="form-container">
            <h1 class="form-title">Set New Password</h1>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Please choose a secure new password for your account</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
                <input type="hidden" th:field="*{token}">
                <span th:if="${#fields.hasErrors('token')}" th:errors="*{token}" class="form-error"></span>

                <div class="form-group">
                    <label for="newPassword">New Password (Minimum 8 characters) *</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="Enter new password" required autofocus>
                    <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter new password" required>
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></span>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-choco" style="width: 100%; border: none;">
                        <i class="fas fa-check-circle"></i> Save New Password
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/cart-drawer :: cartDrawer}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/hcb-cart.js}"></script>
    <script th:src="@{/js/hcb-main.js}"></script>
</body>
</html>
