# ============================================
# Healthy Choco Bytes - Application Configuration
# ============================================

spring.application.name=hcb
server.port=${SERVER_PORT:10001}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Database Configuration (MariaDB)
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/hcb?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:hcb_user}
spring.datasource.password=${DB_PASSWORD:hcb_password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Session Management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Mail Configuration (Provider-Agnostic)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Business / Application Custom Properties
hcb.email.from=${SMTP_FROM:contact@healthychocobytes.in}
hcb.email.admin=${ADMIN_EMAIL:ashwin@ideaai.in}
hcb.upload.dir=${UPLOAD_DIR:uploads}
hcb.upi.id=${UPI_ID:healthychocobytes@paytm}
hcb.upi.name=${UPI_NAME:Healthy Choco Bytes}
hcb.whatsapp.number=${WHATSAPP_NUMBER:918871921212}

# Actuator & Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# Multipart File Upload (Max 5MB for product images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
